[project]
name = "rlcd"
version = "0.1.0"
description = "Calibration-aware LoRA fine-tuning via label-free contrastive preferences (RLCD-style)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.46",
    "peft>=0.13",
    "trl>=0.12",
    "datasets>=3.0",
    "accelerate>=1.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlcd"]
